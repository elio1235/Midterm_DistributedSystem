services:
  metadata:
    build:
      context: .
      dockerfile: metadata/Dockerfile
    container_name: metadata
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/postgres
      REPLICATION_FACTOR: "3"
      VNODES: "128"
      HEARTBEAT_TIMEOUT: "10"
      DETECT_INTERVAL: "2"
      REPAIR_SWEEP_INTERVAL: "30"
      SCRUB_INTERVAL: "120"
      ORPHAN_GRACE: "3600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
    restart: unless-stopped

  storage-node-1:
    build: ./storage_node
    container_name: storage-node-1
    environment:
      NODE_ID: node-1
      NODE_URL: http://storage-node-1:8000
      METADATA_URL: http://metadata:9000
      HEARTBEAT_INTERVAL: "3"
    volumes:
      - node1-data:/data
    ports:
      - "8001:8000"
    depends_on:
      - metadata
    restart: unless-stopped

