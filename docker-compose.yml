services:
  metadata:
    build:
      context: .
      dockerfile: metadata/Dockerfile
    container_name: metadata
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/postgres
      REPLICATION_FACTOR: "3"
      VNODES: "128"
      HEARTBEAT_TIMEOUT: "10"
      DETECT_INTERVAL: "2"
      REPAIR_SWEEP_INTERVAL: "30"
      SCRUB_INTERVAL: "120"
      ORPHAN_GRACE: "3600"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
    restart: unless-stopped

  storage-node-1:
    build: ./storage_node
    container_name: storage-node-1
    environment:
      NODE_ID: node-1
      NODE_URL: http://storage-node-1:8000
      METADATA_URL: http://metadata:9000
      HEARTBEAT_INTERVAL: "3"
    volumes:
      - node1-data:/data
    ports:
      - "8001:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  storage-node-2:
    build: ./storage_node
    container_name: storage-node-2
    environment:
      NODE_ID: node-2
      NODE_URL: http://storage-node-2:8000
      METADATA_URL: http://metadata:9000
      HEARTBEAT_INTERVAL: "3"
    volumes:
      - node2-data:/data
    ports:
      - "8002:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  storage-node-3:
    build: ./storage_node
    container_name: storage-node-3
    environment:
      NODE_ID: node-3
      NODE_URL: http://storage-node-3:8000
      METADATA_URL: http://metadata:9000
      HEARTBEAT_INTERVAL: "3"
    volumes:
      - node3-data:/data
    ports:
      - "8003:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  storage-node-4:
    build: ./storage_node
    container_name: storage-node-4
    environment:
      NODE_ID: node-4
      NODE_URL: http://storage-node-4:8000
      METADATA_URL: http://metadata:9000
      HEARTBEAT_INTERVAL: "3"
    volumes:
      - node4-data:/data
    ports:
      - "8004:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  storage-node-5:
    build: ./storage_node
    container_name: storage-node-5
    environment:
      NODE_ID: node-5
      NODE_URL: http://storage-node-5:8000
      METADATA_URL: http://metadata:9000
      HEARTBEAT_INTERVAL: "3"
    volumes:
      - node5-data:/data
    ports:
      - "8005:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  storage-node-6:
    build: ./storage_node
    container_name: storage-node-6
    environment:
      NODE_ID: node-6
      NODE_URL: http://storage-node-6:8000
      METADATA_URL: http://metadata:9000
      HEARTBEAT_INTERVAL: "3"
    volumes:
      - node6-data:/data
    ports:
      - "8006:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  storage-node-7:
    build: ./storage_node
    container_name: storage-node-7
    environment:
      NODE_ID: node-7
      NODE_URL: http://storage-node-7:8000
      METADATA_URL: http://metadata:9000
      HEARTBEAT_INTERVAL: "3"
    volumes:
      - node7-data:/data
    ports:
      - "8007:8000"
    depends_on:
      - metadata
    restart: unless-stopped

  # ---------------------------------------------------------------- Phase 5 and 6
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      METADATA_URL: http://metadata:9000
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/postgres
      ES_URL: http://elasticsearch:9200
      JWT_SECRET: "please-change-this-to-a-long-random-secret-before-any-real-use"
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin123
      RATE_LIMIT_PER_MIN: "600"
      RATE_LIMIT_BURST: "200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      - metadata
      - elasticsearch
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: ui
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  esdata:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
  node6-data:
  node7-data:
